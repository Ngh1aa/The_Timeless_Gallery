name: Publish complete FinFlow Pages artifact

on:
  workflow_run:
    workflows:
      - FinFlow QA + GitHub Pages
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: finflow-complete-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Assemble complete deploy directory
        run: |
          mkdir -p _site
          cp index.html finflow.css finflow.js ad-banner.html design-lens.html _site/
          cp -R assets _site/assets
          cp -R figma-pack _site/figma-pack
          touch _site/.nojekyll

          test -f _site/design-lens.html
          grep -q 'EVIDENCE LENS / ROUND 01 PREP' _site/design-lens.html
          grep -q 'index.html' _site/design-lens.html
          echo 'Complete Pages artifact includes design-lens.html.'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy complete artifact
        id: deployment
        uses: actions/deploy-pages@v4
