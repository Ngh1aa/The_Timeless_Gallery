name: Deploy FinFlow to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  qa:
    name: Static QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: node --check finflow.js

      - name: Verify required site files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = [
              Path("index.html"),
              Path("finflow.css"),
              Path("finflow.js"),
              Path("ad-banner.html"),
              Path("assets/finflow-ad-1080.svg"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing required files: " + ", ".join(missing))
          print("Required FinFlow assets are present.")
          PY

      - name: Smoke test static site
        run: |
          python3 -m http.server 4173 >/tmp/finflow-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/ad-banner.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/assets/finflow-ad-1080.svg >/dev/null

  build:
    name: Build Pages artifact
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble deploy directory
        run: |
          mkdir -p _site/assets
          cp index.html finflow.css finflow.js ad-banner.html _site/
          cp assets/finflow-ad-1080.svg _site/assets/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
