name: FinFlow QA + GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: finflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Static + Visual QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: node --check finflow.js

      - name: Verify required site files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = [
              Path("index.html"),
              Path("finflow.css"),
              Path("finflow.js"),
              Path("ad-banner.html"),
              Path("assets/finflow-ad-1080.svg"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing required files: " + ", ".join(missing))
          print("Required FinFlow assets are present.")

          html = Path("index.html").read_text(encoding="utf-8")
          section_ids = []
          for marker in ('id="top"', 'id="mechanism"', 'id="trust"'):
              if marker in html:
                  section_ids.append(marker)
          if len(section_ids) != 3 or html.count("<section ") != 3:
              raise SystemExit("Landing must contain exactly three narrative <section> blocks: hero, mechanism, trust/outcomes/conversion.")
          if 'id="outcomes"' in html or 'class="cta-section"' in html:
              raise SystemExit("Legacy standalone outcomes/CTA sections must not return.")
          if "Playfair Display" in html:
              raise SystemExit("Playfair serif is not allowed in the Master Command V2 direction.")
          print("Three-section and sans+mono structure verified.")
          PY

      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/finflow-http.log 2>&1 &
          echo $! > /tmp/finflow-http.pid
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/ad-banner.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/assets/finflow-ad-1080.svg >/dev/null

      - name: Capture rendered QA evidence
        run: |
          mkdir -p qa-evidence
          cat > _qa_capture.html <<'HTML'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <style>
              html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f3ec}
              iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
            </style>
          </head>
          <body>
            <iframe id="site" src="./index.html" title="FinFlow QA viewport"></iframe>
            <script>
              const frame = document.getElementById('site');
              const params = new URLSearchParams(location.search);
              const target = params.get('target') || 'top';
              const step = params.get('step');
              const scenario = params.get('scenario');
              frame.addEventListener('load', () => {
                const doc = frame.contentDocument;
                doc.documentElement.style.scrollBehavior = 'auto';
                doc.body.style.scrollBehavior = 'auto';
                if (scenario) {
                  doc.querySelector(`[data-scenario="${scenario}"]`)?.click();
                  const selectedRail = doc.querySelector('[data-rail][data-state="selected"]');
                  document.body.dataset.selectedRail = selectedRail?.dataset.rail || 'none';
                }
                if (step) {
                  doc.querySelector(`[data-step="${step}"]`)?.click();
                  const activeMini = doc.querySelector('.mini-node.is-current');
                  document.body.dataset.activeMini = activeMini?.dataset.mini || 'none';
                }
                if (target === 'top') {
                  frame.contentWindow.scrollTo(0, 0);
                } else {
                  doc.querySelector(target)?.scrollIntoView({ block: 'start', inline: 'nearest' });
                }
              });
            </script>
          </body>
          </html>
          HTML

          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium is unavailable on runner"
            exit 1
          fi
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --force-prefers-reduced-motion --virtual-time-budget=3500 --window-size=1440,1100 --screenshot=qa-evidence/01-hero-desktop.png 'http://127.0.0.1:4173/_qa_capture.html?target=top'
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --force-prefers-reduced-motion --virtual-time-budget=3500 --window-size=1440,1100 --screenshot=qa-evidence/01b-hero-bank-desktop.png 'http://127.0.0.1:4173/_qa_capture.html?target=top&scenario=bank'
          "$CHROME" --headless --disable-gpu --no-sandbox --force-prefers-reduced-motion --virtual-time-budget=3500 --dump-dom 'http://127.0.0.1:4173/_qa_capture.html?target=top&scenario=bank' | grep -q 'data-selected-rail="bank"'
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --force-prefers-reduced-motion --virtual-time-budget=3500 --window-size=1440,1100 --screenshot=qa-evidence/02-mechanism-desktop.png 'http://127.0.0.1:4173/_qa_capture.html?target=%23mechanism'
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --force-prefers-reduced-motion --virtual-time-budget=3500 --window-size=1440,1100 --screenshot=qa-evidence/02b-mechanism-route-desktop.png 'http://127.0.0.1:4173/_qa_capture.html?target=%23mechanism&step=route'
          "$CHROME" --headless --disable-gpu --no-sandbox --force-prefers-reduced-motion --virtual-time-budget=3500 --dump-dom 'http://127.0.0.1:4173/_qa_capture.html?target=%23mechanism&step=route' | grep -q 'data-active-mini="route"'
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --force-prefers-reduced-motion --virtual-time-budget=3500 --window-size=1440,1100 --screenshot=qa-evidence/03-trust-outcomes-desktop.png 'http://127.0.0.1:4173/_qa_capture.html?target=%23trust'
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --force-prefers-reduced-motion --virtual-time-budget=3500 --window-size=1440,1100 --screenshot=qa-evidence/04-conversion-desktop.png 'http://127.0.0.1:4173/_qa_capture.html?target=%23request-demo'
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --force-prefers-reduced-motion --virtual-time-budget=3500 --window-size=390,844 --screenshot=qa-evidence/05-hero-mobile.png 'http://127.0.0.1:4173/_qa_capture.html?target=top'
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --force-prefers-reduced-motion --virtual-time-budget=3500 --window-size=390,844 --screenshot=qa-evidence/06-mechanism-mobile.png 'http://127.0.0.1:4173/_qa_capture.html?target=%23mechanism'
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --force-prefers-reduced-motion --virtual-time-budget=3500 --window-size=390,844 --screenshot=qa-evidence/07-trust-mobile.png 'http://127.0.0.1:4173/_qa_capture.html?target=%23trust'
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --force-prefers-reduced-motion --virtual-time-budget=2500 --window-size=1080,1080 --screenshot=qa-evidence/08-ad-creative.png http://127.0.0.1:4173/assets/finflow-ad-1080.svg
          ls -lh qa-evidence

      - name: Upload visual QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: finflow-visual-qa
          path: qa-evidence
          if-no-files-found: error

  build:
    name: Build Pages artifact
    if: github.event_name != 'pull_request'
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble deploy directory
        run: |
          mkdir -p _site/assets
          cp index.html finflow.css finflow.js ad-banner.html _site/
          cp assets/finflow-ad-1080.svg _site/assets/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
