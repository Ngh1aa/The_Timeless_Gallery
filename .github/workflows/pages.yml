name: FinFlow QA + GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: finflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Static + Visual QA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: node --check finflow.js

      - name: Verify required site files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          required = [
              Path("index.html"),
              Path("finflow.css"),
              Path("finflow.js"),
              Path("ad-banner.html"),
              Path("assets/finflow-ad-1080.svg"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing required files: " + ", ".join(missing))
          print("Required FinFlow assets are present.")
          PY

      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/finflow-http.log 2>&1 &
          echo $! > /tmp/finflow-http.pid
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/ad-banner.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/assets/finflow-ad-1080.svg >/dev/null

      - name: Capture rendered QA evidence
        run: |
          mkdir -p qa-evidence
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium is unavailable on runner"
            exit 1
          fi
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --force-prefers-reduced-motion --virtual-time-budget=3500 --window-size=1440,1100 --screenshot=qa-evidence/01-hero-desktop.png http://127.0.0.1:4173/
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --force-prefers-reduced-motion --virtual-time-budget=3500 --window-size=1440,1100 --screenshot=qa-evidence/02-mechanism-desktop.png 'http://127.0.0.1:4173/#mechanism'
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --force-prefers-reduced-motion --virtual-time-budget=3500 --window-size=1440,1100 --screenshot=qa-evidence/03-visibility-desktop.png 'http://127.0.0.1:4173/#visibility'
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --force-prefers-reduced-motion --virtual-time-budget=3500 --window-size=390,844 --screenshot=qa-evidence/04-hero-mobile.png http://127.0.0.1:4173/
          "$CHROME" --headless --disable-gpu --no-sandbox --hide-scrollbars --force-prefers-reduced-motion --virtual-time-budget=2500 --window-size=1080,1080 --screenshot=qa-evidence/05-ad-creative.png http://127.0.0.1:4173/assets/finflow-ad-1080.svg
          ls -lh qa-evidence

      - name: Upload visual QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: finflow-visual-qa
          path: qa-evidence
          if-no-files-found: error

  build:
    name: Build Pages artifact
    if: github.event_name != 'pull_request'
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble deploy directory
        run: |
          mkdir -p _site/assets
          cp index.html finflow.css finflow.js ad-banner.html _site/
          cp assets/finflow-ad-1080.svg _site/assets/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
