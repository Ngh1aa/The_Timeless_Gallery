<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinFlow — 1:1 Ad Creative</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#0c1c33;--ivory:#f6f3ec;--gold:#a9803e;--line:#d8d0bd;--ink:#12203a;--soft:#4c5a72}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;padding:30px;display:grid;place-items:center;background:var(--ivory);font-family:Inter,sans-serif;color:var(--ink)}
    .page{width:min(100%,1120px);display:grid;gap:24px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
    .toolbar strong{font-family:"Playfair Display",serif;font-size:18px;color:var(--navy)}.toolbar span{display:block;margin-top:5px;color:var(--soft);font-size:12px}
    .actions{display:flex;gap:8px}.actions a{min-height:42px;padding:0 15px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--navy);color:var(--navy);text-decoration:none;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
    .actions a.primary{color:var(--ivory);background:var(--navy)}.canvas{width:min(88vw,900px);aspect-ratio:1;margin:auto;overflow:hidden;border:1px solid var(--line);background:var(--ivory)}.canvas img{width:100%;height:100%;display:block}
    .note{margin:0 auto;max-width:760px;color:var(--soft);font-size:12px;line-height:1.65;text-align:center}
    @media(max-width:700px){body{padding:18px}.toolbar{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions a{flex:1}.canvas{width:100%}}
  </style>
</head>
<body>
  <main class="page">
    <div class="toolbar">
      <div><strong>FinFlow — Facebook / Instagram Ad</strong><span>1:1 creative · 1080 × 1080 · Institutional finance campaign system</span></div>
      <div class="actions"><a href="./index.html">← Landing page</a><a class="primary" href="./assets/finflow-ad-1080.svg" download>Download SVG</a></div>
    </div>
    <figure class="canvas"><img src="./assets/finflow-ad-1080.svg" alt="FinFlow institutional multi-rail settlement ad showing one payout instruction and five settlement rails with the wallet rail selected." /></figure>
    <p class="note">The ad mirrors the landing page’s institutional ledger language: ivory field, navy settlement ledger, one gold selected state and restrained mono transaction metadata.</p>
  </main>
</body>
</html>
